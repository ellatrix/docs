name: E2E Tests (WP 7.0)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start WordPress
        run: |
          cp .wp-env.7.0.json .wp-env.json
          npx wp-env start

      - name: Activate plugin on test site
        run: npx wp-env run tests-cli -- wp plugin deactivate docs && npx wp-env run tests-cli -- wp plugin activate docs

      - name: Deactivate Gutenberg
        run: npx wp-env run tests-cli -- wp plugin deactivate gutenberg

      - name: Verify environment
        run: |
          npx wp-env run tests-cli -- wp core version | grep -q '^7\.' || (echo "Expected WP 7.x" && exit 1)
          npx wp-env run tests-cli -- wp plugin get gutenberg --field=status | grep -q 'inactive' || (echo "Gutenberg should be inactive" && exit 1)

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-7.0
          path: artifacts/
